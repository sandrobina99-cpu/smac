services:
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: sandrobina-api-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "${PORT:-8787}"
      HOST: "0.0.0.0"
      DATA_DIR: "/app/data"
    ports:
      - "${PORT:-8787}:8787"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
