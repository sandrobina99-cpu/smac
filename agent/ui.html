<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smac Agent</title>
<link rel="stylesheet" href="/katex/katex.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css'">
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<div class="app" id="appRoot">
  <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

  <aside class="sidebar" id="sidebar" aria-label="侧边导航与历史对话">
    <div class="side-head">
      <button class="icon-circle side-toggle" id="btnCollapseSidebar" type="button" title="收起侧边栏 (Ctrl/⌘+B)" aria-label="收起侧边栏">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1.75" y="2.25" width="12.5" height="11.5" rx="2.4"/>
          <line x1="6" y1="2.5" x2="6" y2="13.5"/>
        </svg>
      </button>
      <div class="backend-picker" title="切换无头 Agent 后端引擎">
        <select id="backendSelect" aria-label="选择后端引擎"></select>
        <svg class="chev" viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
      </div>
      <button class="icon-circle" id="btnReload" type="button" title="重新加载页面" aria-label="重新加载">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.35-3.6"/>
          <path d="M13.5 2.75v2.75h-2.75"/>
        </svg>
      </button>
    </div>

    <div class="side-actions">
      <button class="new-chat" id="btnNew" type="button">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11.6 2.4a1.7 1.7 0 0 1 2.4 2.4L6.3 12.5 2.8 13.5l1-3.5 7.8-7.6z"/>
          <path d="M9.8 4.2l2 2"/>
        </svg>
        <span>新对话</span>
      </button>
    </div>

    <div class="side-env">
      <div class="env-row" title="切换同步根目录">
        <svg class="env-ico" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1.8 4.2A1.4 1.4 0 0 1 3.2 2.8h3l1.4 1.5h5.2a1.4 1.4 0 0 1 1.4 1.4v6.1a1.4 1.4 0 0 1-1.4 1.4H3.2a1.4 1.4 0 0 1-1.4-1.4z"/>
        </svg>
        <select id="rootSelect" aria-label="同步目录"></select>
        <svg class="chev" viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
      </div>
      <div class="env-row" id="providerRow" title="提供商 / 订阅账号">
        <svg class="env-ico" viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="5.5" r="2.6"/>
          <path d="M2.8 13.2a5.4 5.4 0 0 1 10.4 0"/>
        </svg>
        <select id="providerSelect" aria-label="提供商或账号"></select>
        <svg class="chev" viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
      </div>
      <div class="root-note" id="rootNote" hidden></div>
    </div>

    <div class="history">
      <div class="history-head">
        <span>历史对话</span>
        <button class="mini-icon" id="btnHistoryRefresh" type="button" title="刷新历史对话" aria-label="刷新历史对话">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.35-3.6"/>
            <path d="M13.5 2.75v2.75h-2.75"/>
          </svg>
        </button>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty">暂无历史对话</div>
      </div>
    </div>

    <div class="side-foot">
      <details class="side-details">
        <summary>
          <span class="status-dot"></span>
          <span id="hermesState" class="foot-state">连接中</span>
          <span class="device-chip" id="deviceName"></span>
        </summary>
        <div class="side-details-body">
          <div class="session-box">
            <div class="srow"><span>会话</span><code id="sessionName" title=""></code></div>
            <div class="srow"><span>工具</span><span id="toolSummary">file · todo</span></div>
            <div class="srow"><span>范围</span><span>仅所选目录</span></div>
          </div>
          <div class="safety" id="safetyNote">
            Agent 运行在远端机器上，使用该机器已登录的额度。模型只能读写当前选择的同步目录 / 工作区，写入前有双重路径校验。
          </div>
        </div>
      </details>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <button class="icon-circle top-toggle" id="btnToggleSidebar" type="button" title="展开/收起侧边栏 (Ctrl/⌘+B)" aria-label="展开侧边栏">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1.75" y="2.25" width="12.5" height="11.5" rx="2.4"/>
            <line x1="6" y1="2.5" x2="6" y2="13.5"/>
          </svg>
        </button>
        <button class="icon-circle only-mobile" id="btnSettings" type="button" title="菜单" aria-label="打开菜单" hidden>
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="2.5" y1="4.5" x2="13.5" y2="4.5"/><line x1="2.5" y1="8" x2="13.5" y2="8"/><line x1="2.5" y1="11.5" x2="13.5" y2="11.5"/></svg>
        </button>
        <div class="chat-title-wrap">
          <span class="chat-title" id="chatTitle">新对话</span>
          <span class="top-device" id="topDevice"></span>
        </div>
      </div>
      <div class="top-actions">
        <span class="conn" id="conn"><i></i><span>连接中</span></span>
        <button class="icon-circle" id="btnNewTop" type="button" title="新对话" aria-label="新对话">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11.6 2.4a1.7 1.7 0 0 1 2.4 2.4L6.3 12.5 2.8 13.5l1-3.5 7.8-7.6z"/>
            <path d="M9.8 4.2l2 2"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="messages" id="messages"></div>

    <button class="jump" id="jump" type="button" hidden title="滚动到底部">
      <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.2v9.6"/><path d="M4.2 9.2 8 13l3.8-3.8"/></svg>
      <span>回到底部</span>
    </button>

    <div class="composer-wrap">
      <div class="composer" id="composer">
        <div class="attachments" id="attachments" hidden></div>
        <textarea id="input" rows="1" placeholder="向远端 Agent 提问；可拖入、粘贴或上传任意主机文件 / 图片…"></textarea>
        <div class="composer-bar">
          <div class="left">
            <button class="plus-btn" id="btnAttach" type="button" title="上传主机文件或图片到当前工作区" aria-label="添加文件或图片">
              <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg>
            </button>
            <button class="pill-btn workdir-pill" id="btnWorkdir" type="button" title="选择同步目录下的工作区子文件夹">
              <svg viewBox="0 0 16 16" width="12.5" height="12.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1.8 4.2A1.4 1.4 0 0 1 3.2 2.8h3l1.4 1.5h5.2a1.4 1.4 0 0 1 1.4 1.4v6.1a1.4 1.4 0 0 1-1.4 1.4H3.2a1.4 1.4 0 0 1-1.4-1.4z"/>
              </svg>
              <span class="wd-name" id="workdirName">同步目录根</span>
              <svg class="chev" viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
            </button>
            <label class="fast-toggle" id="fastField" for="fastToggle" hidden title="快速模式：优先响应速度">
              <input type="checkbox" id="fastToggle">
              <span class="switch"></span>
              <span class="fast-text">快速</span>
              <em id="fastHint" hidden>优先响应</em>
            </label>
          </div>
          <div class="right">
            <div class="inline-picker model-picker" title="选择模型">
              <select id="modelSelect" aria-label="选择模型"></select>
              <svg class="chev" viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
            </div>
            <div class="inline-picker reasoning-picker" title="选择思考强度">
              <select id="reasoningSelect" aria-label="选择思考强度"></select>
              <svg class="chev" viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
            </div>
            <button class="mini-icon refresh-models-btn" id="btnRefreshModels" type="button" title="从客机重新同步登录账号与最新模型" aria-label="刷新模型">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13.5 8a5.5 5.5 0 1 1-1.35-3.6"/>
                <path d="M13.5 2.75v2.75h-2.75"/>
              </svg>
            </button>
            <button class="stop-circle" id="btnStop" type="button" hidden title="停止当前任务" aria-label="停止">
              <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor"><rect x="3.5" y="3.5" width="9" height="9" rx="2"/></svg>
            </button>
            <button class="send-circle" id="btnSend" type="button" title="发送 (Enter)" aria-label="发送">
              <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 12.5V3.5"/>
                <path d="M4.2 7.2 8 3.4l3.8 3.8"/>
              </svg>
            </button>
          </div>
        </div>
        <input type="file" id="fileInput" multiple hidden>
      </div>
      <div class="status" id="status"></div>
    </div>
  </main>
</div>

<div class="modal" id="wdModal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h2>选择工作区</h2>
        <p>工作区是当前同步目录下的子文件夹，Agent 只会在选中的工作区里读写。</p>
      </div>
      <button class="modal-x" id="wdClose" type="button">×</button>
    </div>
    <div class="wd-pathbar">
      <span>当前位置</span>
      <code id="wdPath">/</code>
    </div>
    <div class="wd-list" id="wdList"></div>
    <form class="wd-new" id="wdNewForm">
      <input id="wdNewName" maxlength="80" placeholder="新建文件夹名称，例如：论文-第三章" autocomplete="off">
      <button class="ghost" id="wdCreate" type="submit">新建文件夹</button>
    </form>
    <div class="modal-foot">
      <div class="left">
        <button class="ghost" id="wdUp" type="button">上一级</button>
        <button class="ghost" id="wdRoot" type="button">根目录</button>
      </div>
      <div class="right">
        <button class="ghost" id="wdCancel" type="button">取消</button>
        <button class="primary" id="wdUse" type="button">使用此工作区</button>
      </div>
    </div>
  </div>
</div>

<div class="preview" id="preview" hidden>
  <div class="preview-card">
    <div class="preview-head">
      <div class="preview-title" id="previewTitle"></div>
      <div class="preview-actions">
        <a class="ghost" id="previewDownload" target="_blank" rel="noopener">下载 / 原文件</a>
        <button class="modal-x" id="previewClose" type="button">×</button>
      </div>
    </div>
    <div class="preview-body" id="previewBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose" type="button">×</button>
  <img id="lightboxImg" alt="">
</div>
<div class="fatal" id="fatal" hidden>
  <div class="fatal-card">
    <div class="fatal-icon">◈</div>
    <h1>无法打开 Agent 页面</h1>
    <p id="fatalText"></p>
    <button class="primary" id="fatalClose" type="button">关闭</button>
  </div>
</div>

<script src="/katex/katex.min.js" onerror="(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js';s.onload=function(){if(window.__smacRerenderMath)window.__smacRerenderMath();};document.head.appendChild(s);})()"></script>
<script src="/ui.js"></script>
</body>
</html>
